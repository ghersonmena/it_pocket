# HTTP: redirige todo a HTTPS (la cámara del teléfono solo funciona con HTTPS).
# El puerto 450 es el que se publica en docker-compose para HTTPS.
server {
    listen 80;
    server_name _;

    return 301 https://$host:450$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificado del servidor (montado desde ./certs, ver certs/README.md)
    ssl_certificate     /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Headers de seguridad y soporte CORS
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,App-Token,Session-Token" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Módulos ES (.mjs, p. ej. el worker de pdf.js): el mime.types de nginx no los conoce y los
    # serviría como binario; el navegador rechaza un worker que no llega como JavaScript
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Servicio push opcional (contenedor "push"). Se resuelve en cada petición: si el servicio no
    # existe, nginx arranca igual, /push/ responde 502 y la app simplemente no ofrece el push
    location /push/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $push_upstream http://push:8080;
        proxy_pass $push_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
    }

    # Service worker de las notificaciones: sin caché, para que el teléfono tome siempre la última
    # versión
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Manifiesto de la app (instalarla en la pantalla de inicio). Sin caché larga para que los
    # cambios de nombre o ícono lleguen al teléfono
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Cache de activos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

version: '3.8'

services:
  glpi-mobile-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GLPI_URL: ${VITE_GLPI_URL:-http://localhost/glpi}
        VITE_GLPI_APP_TOKEN: ${VITE_GLPI_APP_TOKEN:-}
        VITE_ENABLE_MOCK: ${VITE_ENABLE_MOCK:-false}
    container_name: glpi_mobile_app
    ports:
      - "8010:80"   # HTTP: redirige a HTTPS (8086 y 8087 están ocupados en el servidor)
      - "450:443"   # HTTPS
    volumes:
      # Certificados SSL del servidor (ver certs/README.md); solo lectura
      - ./certs:/etc/nginx/certs:ro
    env_file:
      - .env
    restart: unless-stopped

  # Avisos con la app cerrada (Web Push). OPCIONAL: sin el token del usuario de servicio arranca
  # desactivado y la app funciona igual. Configurar: docker compose run --rm push npm run setup
  push:
    build:
      context: .
      dockerfile: push-service/Dockerfile
    container_name: glpi_mobile_push
    env_file:
      - .env
    environment:
      # Zona horaria de GLPI (las fechas de las tareas están en hora local)
      TZ: ${PUSH_TZ:-America/Mexico_City}
    volumes:
      - ./push-data:/data
    restart: unless-stopped
